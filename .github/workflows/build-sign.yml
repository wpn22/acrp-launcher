name: Build & Sign

on:
  release:
    types: [created]

jobs:
  build:
    # Not every release here is a launcher release - the jobs plugin publishes its own jar
    # under jobs-v* tags. Attaching a Windows launcher installer to one of those would put
    # the wrong download in front of players, so this job stays out of the way.
    if: ${{ !startsWith(github.event.release.tag_name, 'jobs-v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Install osslsigncode
        run: choco install osslsigncode -y

      - name: Sign installer
        if: env.SIGNING_TOKEN != ''
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNING_TOKEN }}
        run: |
          osslsigncode extract-data -in "dist/ACRP Launcher-setup-1.0.0.exe" -out tosign.bin
          curl -X POST `
            -H "Authorization: Bearer $env:SIGNING_TOKEN" `
            --data-binary @tosign.bin `
            https://sign.necessary.nu/windows/sign -o signed.bin
          osslsigncode attach-signature -sigin signed.bin -in "dist/ACRP Launcher-setup-1.0.0.exe" -out "dist/ACRP Launcher-setup-1.0.0-signed.exe"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ACRP Launcher-setup-1.0.0.exe
            dist/ACRP Launcher-setup-1.0.0-signed.exe
