name: Build Jobs Plugin

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build plugin
        working-directory: server/acrp-jobs
        run: mvn -B -ntp clean package

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test AI bridge
        working-directory: server/acrp-ai-bridge
        run: node test/run-tests.js

      - name: Upload plugin jar
        uses: actions/upload-artifact@v5
        with:
          name: ACRPJobs-plugin
          path: server/acrp-jobs/target/ACRPJobs-*.jar
          if-no-files-found: error
