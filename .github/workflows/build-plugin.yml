name: Build Jobs Plugin

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - 'server/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build plugin
        working-directory: server/acrp-jobs
        run: mvn -B -ntp clean package

      - name: Check message keys
        working-directory: server/acrp-jobs
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/check-messages.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test AI bridge
        working-directory: server/acrp-ai-bridge
        run: node test/run-tests.js

      - name: Upload plugin jar
        uses: actions/upload-artifact@v5
        with:
          name: ACRPJobs-plugin
          path: server/acrp-jobs/target/ACRPJobs-*.jar
          if-no-files-found: error

  # Compiling proves the code is valid Java. It does not prove the plugin actually starts.
  # This boots a real 1.12.2 server with the jar and the test-server presets, so a bad
  # plugin.yml, an unreadable config or an exception in onEnable fails the build instead of
  # being discovered on the live server.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build plugin
        working-directory: server/acrp-jobs
        run: mvn -B -ntp -q clean package

      - name: Fetch a 1.12.2 server
        id: fetch
        run: |
          set -o pipefail
          mkdir -p run/plugins
          BUILD=$(curl -fsS --max-time 60 \
            'https://api.papermc.io/v2/projects/paper/versions/1.12.2' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["builds"][-1])' 2>/dev/null) || true
          if [ -z "${BUILD:-}" ]; then
            echo "PaperMC did not serve a 1.12.2 build - skipping the smoke test."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="https://api.papermc.io/v2/projects/paper/versions/1.12.2/builds/$BUILD/downloads/paper-1.12.2-$BUILD.jar"
          if curl -fsSL --max-time 300 -o run/server.jar "$URL"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Download failed - skipping the smoke test."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Boot the server with the plugin
        if: steps.fetch.outputs.available == 'true'
        run: |
          set -euo pipefail
          cp server/acrp-jobs/target/ACRPJobs-*.jar run/plugins/
          cp server/test-server/preset/eula.txt run/eula.txt
          cp server/test-server/preset/server.properties run/server.properties
          mkdir -p run/plugins/ACRPJobs
          cp server/test-server/preset/plugins/ACRPJobs/*.yml run/plugins/ACRPJobs/

          cd run
          mkfifo console
          # Start the server first, then hold the write end of the pipe open on fd 3. Both opens
          # block until the other side appears, so this order is what lets them meet - and the
          # held fd stops the server seeing EOF on stdin and shutting itself down.
          java -Xmx1500M -jar server.jar nogui < console > server.log 2>&1 &
          SERVER=$!
          exec 3> console

          for i in $(seq 1 180); do
            grep -q 'Done (' server.log && break
            kill -0 "$SERVER" 2>/dev/null || { echo "server died early"; break; }
            sleep 1
          done

          # Exercise a few code paths that only run on the main thread.
          for cmd in "jobsadmin zone check" "jobsadmin spot list" "jobsadmin route list" "jobsadmin reload"; do
            echo "$cmd" >&3
            sleep 2
          done
          echo stop >&3

          for i in $(seq 1 60); do kill -0 "$SERVER" 2>/dev/null || break; sleep 1; done
          exec 3>&-
          kill "$SERVER" 2>/dev/null || true
          echo "::group::server.log"; cat server.log; echo "::endgroup::"

      - name: Assert a clean startup
        if: steps.fetch.outputs.available == 'true'
        run: |
          set -euo pipefail
          LOG=run/server.log
          fail() { echo "SMOKE TEST FAILED: $1"; exit 1; }

          grep -q 'Done (' "$LOG" || fail "the server never finished starting"
          grep -q '\[ACRPJobs\] Enabled' "$LOG" || fail "ACRPJobs did not enable"
          grep -q '\[ACRPJobs\] Storage ready' "$LOG" || fail "storage did not come up"

          # The plugin prints its own counts; all of the presets must have been read.
          grep -qE '\[ACRPJobs\] Loaded [1-9][0-9]* zone' "$LOG" || fail "zones.yml was not loaded"
          grep -qE '\[ACRPJobs\] Loaded [1-9][0-9]* route' "$LOG" || fail "routes.yml was not loaded"
          grep -qE '\[ACRPJobs\] Loaded [1-9][0-9]* work spot pool' "$LOG" || fail "spots.yml was not loaded"

          if grep -q 'Missing message key' "$LOG"; then
            grep -n 'Missing message key' "$LOG" | head
            fail "a message key is missing at runtime"
          fi
          if grep -qE 'Could not load .plugins/ACRPJobs|Error occurred while enabling ACRPJobs' "$LOG"; then
            fail "the plugin failed to load"
          fi
          if grep -qE '^[[:space:]]+at com\.adventurecity\.' "$LOG"; then
            grep -nE -B 10 '^[[:space:]]+at com\.adventurecity\.' "$LOG" | head -40
            fail "an exception came from our own code"
          fi

          echo "Clean startup: plugin enabled, presets loaded, no exceptions from our code."

      - name: Upload the server log
        if: always() && steps.fetch.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-log
          path: run/server.log
          if-no-files-found: ignore
