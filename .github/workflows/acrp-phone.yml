name: ACRP Phone

# The phone mod lives under phone-mod/ until it moves to its own repository.
# Scoped by path so launcher-only commits do not trigger a Forge build.
on:
  push:
    paths: ['phone-mod/**', '.github/workflows/acrp-phone.yml']
  pull_request:
    paths: ['phone-mod/**', '.github/workflows/acrp-phone.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: phone-mod

jobs:
  # Everything that does not touch Minecraft: the text engine, the atlas packer,
  # the squircle geometry, phone numbers. Seconds, and it gates the slow jobs.
  logic:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Fetch JUnit
        run: |
          mkdir -p build/testlibs
          curl -sSfL -o build/testlibs/junit.jar \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfL -o build/testlibs/hamcrest.jar \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile Minecraft-free sources
        run: |
          mkdir -p build/classes build/testclasses
          javac -encoding UTF-8 -d build/classes \
            $(find src/main/java/com/acrp/phone/client/text -name '*.java') \
            $(find src/main/java/com/acrp/phone/client/ui -name '*.java') \
            src/main/java/com/acrp/phone/client/font/AtlasPacker.java \
            src/main/java/com/acrp/phone/core/PhoneNumber.java
          javac -encoding UTF-8 \
            -cp "build/classes:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            -d build/testclasses $(find src/test/java -name '*.java')

      - name: Run tests
        run: |
          java -Dfile.encoding=UTF-8 -Djava.awt.headless=true \
            -cp "build/classes:build/testclasses:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            org.junit.runner.JUnitCore \
            com.acrp.phone.client.text.TextShaperTest \
            com.acrp.phone.client.text.TextLayoutTest \
            com.acrp.phone.client.font.AtlasPackerTest \
            com.acrp.phone.client.ui.SquircleTest \
            com.acrp.phone.core.PhoneNumberTest

      # The only way anyone sees this interface: the real screen code, rendered.
      - name: Render screens
        run: |
          java -Dfile.encoding=UTF-8 -Djava.awt.headless=true \
            -cp "build/classes:build/testclasses:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            com.acrp.phone.client.ui.ScreenshotRunner build/shots
          java -Dfile.encoding=UTF-8 -Djava.awt.headless=true \
            -cp "build/classes:build/testclasses:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            com.acrp.phone.client.text.TextRenderProof build/shots/text-proof.png

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: phone-mod/build/shots/*.png

  # The first real compile of anything that imports Forge. Forge's maven is
  # unreachable from the development environment, so this job is the only place
  # those classes are checked at all.
  forge:
    name: Forge build
    runs-on: ubuntu-latest
    needs: logic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg-${{ hashFiles('phone-mod/**/*.gradle', 'phone-mod/gradle.properties') }}
          restore-keys: ${{ runner.os }}-fg-

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: acrpphone-jar
          path: phone-mod/build/libs/*.jar

  # Boots a dedicated server with the mod installed. Proves it loads, registers
  # its items and sounds, and does not crash - which no unit test can show.
  server-boot:
    name: Server smoke test
    runs-on: ubuntu-latest
    needs: forge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-fg-${{ hashFiles('phone-mod/**/*.gradle', 'phone-mod/gradle.properties') }}
          restore-keys: ${{ runner.os }}-fg-

      - name: Accept EULA
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt

      - name: Boot server
        run: |
          chmod +x gradlew
          # runServer never returns on its own, so cap it and read the log after.
          timeout 420 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          tail -80 server.log

      - name: Check the mod loaded
        run: |
          if grep -qiE "Exception|Caused by:|crash" server.log; then
            echo "::error::server log contains a failure"
            grep -iE -A15 "Exception|Caused by:" server.log | head -60
            exit 1
          fi
          if ! grep -q "acrpphone" server.log; then
            echo "::error::mod acrpphone never appeared in the server log"
            exit 1
          fi
          echo "mod loaded cleanly"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: phone-mod/server.log
