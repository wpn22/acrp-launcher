# ============================================================
#  مسارات سكان المدينة (Routes)
#  ما تحتاج تكتب هنا شي — ارسم المسار داخل اللعبة:
#
#     /jobsadmin route new main_street     ← ياخذك لوضع الرسم ويعطيك العصا
#     نقرة يمين على بلوك                   ← زاوية جديدة
#     نقرة يسار على بلوك                   ← تراجع عن آخر زاوية
#     /jobsadmin route done                ← يعرض لك الخط ويسأل [نعم] / [لا]
#
#  الملف هذا يُكتب تلقائياً بعد ما تضغط [نعم]. تقدر تعدّل الأرقام هنا
#  مباشرة ثم /jobsadmin reload ، أو من داخل اللعبة:
#     /jobsadmin route set main_street speed 2.5
# ============================================================
#
# مثال كامل لمسار (احذف علامة # لو تبي تكتبه بيدك):
#
# routes:
#   main_street:
#     world: world
#     # LOOP = يرجع لأول زاوية ويلف | PINGPONG = يمشي ويرجع بالعكس
#     mode: LOOP
#     # سرعة المشي (بلوك/ثانية). ٣.٢ قريبة من سرعة مشي اللاعب.
#     speed: 3.2
#     # كم بوت على هذا المسار (يحده السقف العام في config.yml)
#     population: 3
#     # نوع الكيان — VILLAGER يشتغل بدون أي مود
#     entity: VILLAGER
#     # معرّف شخصية من npcs.yml — اتركه فاضي = ديكور صامت، املأه = يتكلم
#     persona: ""
#     # أسماء تظهر فوق رؤوسهم (يُختار اسم عشوائي لكل بوت)
#     names:
#       - "مواطن"
#       - "ساكن المدينة"
#     # ما يُستدعى ككيان إلا إذا فيه لاعب داخل هذي المسافة (بلوك)
#     activationRange: 48
#     # احتمال وقفة قصيرة عند كل زاوية (0 = ما يقف أبداً، 1 = يقف دائماً)
#     pauseChance: 0.15
#     # الزوايا بصيغة x,y,z — تُكتب تلقائياً من نقراتك داخل اللعبة
#     corners:
#       - "120.5,64.0,-88.5"
#       - "140.5,64.0,-88.5"
#       - "140.5,64.0,-60.5"

routes: {}
