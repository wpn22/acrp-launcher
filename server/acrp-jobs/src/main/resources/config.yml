# ============================================================
#  ACRPJobs - نظام وظائف Adventure City Roleplay
#  كل الأرقام هنا قابلة للتعديل بدون لمس الكود.
#  بعد أي تعديل: /jobsadmin reload
# ============================================================

storage:
  # sqlite = بدون أي إعداد (ملف داخل مجلد البلق إن) | mysql = قاعدة بيانات خارجية
  type: sqlite
  mysql:
    host: 127.0.0.1
    port: 3306
    database: acrp
    username: root
    password: ""
    useSSL: false
  # كل كم ثانية تُحفظ بيانات اللاعبين المتغيرة (حفظ غير متزامن، لا يؤثر على TPS)
  autosaveSeconds: 300

economy:
  # اسم العملة كما يظهر للاعبين
  symbol: "AC"
  # رصيد اللاعب الجديد عند أول دخول
  startingBalance: 5000
  # هل يُسمح للاعبين بالتحويل بينهم عبر /ac pay
  allowPlayerTransfer: true
  # ضريبة التحويل بين اللاعبين (نسبة مئوية) - مصرف عملة يقاوم التضخم
  transferTaxPercent: 5
  # أقل مبلغ تحويل
  minTransfer: 100

jobs:
  # الحد الأقصى لعدد الوظائف التي يملكها اللاعب (يشتغل بواحدة في نفس الوقت)
  maxJobsPerPlayer: 3
  # هل يجب أن يكون اللاعب داخل منطقة العمل ليبدأ الدوام
  requireZoneForDuty: true
  # إنهاء الدوام تلقائيا عند الخروج من السيرفر
  endDutyOnQuit: true

payroll:
  # فحص الرواتب كل دقيقة. كل وظيفة تحدد intervalMinutes الخاص بها في ملفها.
  enabled: true
  # لا يُصرف الراتب للاعب متوقف عن الحركة أكثر من هذه المدة (ثواني)
  afkSeconds: 300

antiAbuse:
  # الحد الأقصى لما يكسبه اللاعب من الوظائف يوميا (0 = بلا حد)
  dailyEarningCap: 60000
  # أقل زمن منطقي لإنهاء عقد (ثواني). أقل من هذا = محاولة استغلال، لا يُدفع.
  minContractSeconds: 20
  # أقصى سرعة منطقية (بلوك/ثانية) بين خطوات المهمة. أعلى من هذا = تعليم ومنع الدفع.
  # 22 تقريبا سرعة سيارة سريعة في DynamX - ارفعها لو عندك مركبات أسرع.
  maxBlocksPerSecond: 22
  # تسجيل محاولات الاستغلال في كونسول السيرفر
  logSuspicious: true

hud:
  # شريط الهدف أعلى الشاشة
  bossBar: true
  # سطر التلميح فوق شريط الأدوات
  actionBar: true
  # عمود جزيئات على موقع الهدف (يظهر للاعب صاحب المهمة فقط)
  particles: true
  # مدى ظهور الجزيئات (بلوك)
  particleRange: 64

dispatch:
  # مدة صلاحية طلب التاكسي قبل أن يُلغى تلقائيا (ثواني)
  expireSeconds: 180
  # أقصى عدد طلبات مفتوحة في نفس الوقت
  maxOpenCalls: 30

# ============================================================
#  سكان المدينة المتحركون (Routes)
#  ترسم المسار داخل اللعبة بـ /jobsadmin route new <اسم> ، والبوتات
#  ترسبن عشوائياً عليه وتمشي حسب الخط اللي رسمته.
#  البوت هنا بدون ذكاء فانيلا (setAI false) — يعني تكلفته على السيرفر
#  شبه معدومة مقارنة بأي NPC عادي.
# ============================================================
routes:
  enabled: true
  # *** أهم رقم في هذا القسم ***
  # الحد الأقصى للبوتات الموجودة فعلياً في نفس اللحظة على السيرفر كله
  # (مو لكل مسار). لو مجموع سكان مساراتك ٣٠، يُستدعى منهم ٥ فقط —
  # الأقرب للاعبين — والباقي يتحرك «افتراضياً» بدون كيان.
  # ارفعه بالتدريج وراقب TPS. الحد الأعلى المسموح ٥٠.
  maxActiveWalkers: 5
  # القيم الافتراضية لأي مسار جديد ترسمه (تقدر تغيّرها لكل مسار بعدين
  # بـ /jobsadmin route set <اسم> <خاصية> <قيمة>)
  defaults:
    # ما يُستدعى البوت إلا إذا فيه لاعب داخل هذي المسافة (بلوك)
    activationRange: 48
    # سرعة المشي (بلوك/ثانية) — ٣.٢ قريبة من سرعة مشي اللاعب
    speed: 3.2
    # كم بوت على المسار الواحد
    population: 3

# ============================================================
#  حوارات NPC الذكية (اختياري تماماً)
#  الذكاء الاصطناعي يشتغل في خدمة منفصلة خارج السيرفر — راجع server/acrp-ai-bridge
#  لو عطّلته أو وقفت الخدمة، الـ NPCs يردون بحواراتهم المكتوبة في npcs.yml
#  وما يتأثر شي في اللعبة.
# ============================================================
ai:
  enabled: false
  # عنوان الجسر. لا تخليه عنوان عام أبداً — 127.0.0.1 فقط.
  url: "http://127.0.0.1:8787/dialogue"
  # نفس التوكن المكتوب في config.json عند الجسر
  token: ""
  # أقصى انتظار لرد الشخصية (مللي ثانية). بعده يستخدم الحوار المكتوب.
  timeoutMs: 8000
  # تنتهي المحادثة تلقائياً بعد هذي المدة بدون كلام (ثواني)
  conversationSeconds: 90
  # تنتهي المحادثة إذا ابتعد اللاعب أكثر من هذي المسافة (بلوك)
  conversationRange: 12

# تكامل اختياري مع مودات الباك (DynamX / CustomNPCs).
# معطّل افتراضيا - فعّله فقط بعد ما تتأكد من صيغة الأمر عندك.
# %player% = اسم اللاعب , %vehicle% = معرف المركبة في ملف الوظيفة
integration:
  vehicles:
    enabled: false
    spawnCommand: "dynamx spawn %vehicle% %player%"
    despawnCommand: ""
