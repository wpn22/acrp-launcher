# ============================================================
#  الكهربائي - يصلح أعمدة الإنارة المعطّلة
#
#  المطلوب قبل التشغيل:
#    منطقة:        power_depot   (مقر الدوام)
#    نقاط أعمدة:   /jobsadmin spot new street_lamps LAMP
#
#  العمود المعطّل يظهر عليه دخان وشرر. اقترب منه واضغط يمين لإصلاحه.
#  لو تبي البلوك نفسه يضيء ويُطفأ:  /jobsadmin spot set street_lamps swapBlock true
#  (معطّل افتراضياً لأن مصباح الردستون في 1.12.2 ينطفي مع أي تحديث بلوك جنبه)
# ============================================================
id: electrician
name: "&eالكهربائي"
icon: REDSTONE_TORCH_ON
description:
  - "&7أعمدة الإنارة تتعطّل في المدينة - وأنت اللي تصلحها."
  - "&7اقترب من العمود المعطّل واضغط &fيمين&7."
  - "&7أجرها أعلى من النظافة، وتحتاج تنقّل أكثر."
whitelist: false
dutyZones:
  - power_depot

payroll:
  intervalMinutes: 30
  requiresDuty: true
  taxPercent: 10

grades:
  - level: 1
    name: "فني تحت التدريب"
    salary: 130
    xpRequired: 0
    payMultiplier: 1.0
  - level: 2
    name: "فني كهرباء"
    salary: 210
    xpRequired: 350
    payMultiplier: 1.15
  - level: 3
    name: "كهربائي معتمد"
    salary: 300
    xpRequired: 1200
    payMultiplier: 1.3
  - level: 4
    name: "رئيس فنيين"
    salary: 400
    xpRequired: 3000
    payMultiplier: 1.5

contracts:
  - id: lamp_repair
    name: "&fجولة صيانة الإنارة"
    icon: REDSTONE_LAMP_OFF
    description:
      - "&7صلّح &f٥ &7أعمدة إنارة معطّلة."
      - "&7الوقت المتوقع: &f~4 دقائق"
    basePay: 320
    randomBonus: 100
    xpReward: 30
    cooldownSeconds: 45
    steps:
      - type: CLEAR_SPOTS
        pool: street_lamps
        amount: 5
        title: "صلّح ٥ أعمدة إنارة"

  - id: night_shift
    name: "&fمناوبة ليلية"
    icon: GLOWSTONE
    description:
      - "&7استلم العدّة من المستودع، صلّح &f٨ &7أعمدة، ثم سلّم العدّة."
      - "&7الوقت المتوقع: &f~6 دقائق"
    basePay: 560
    randomBonus: 180
    xpReward: 60
    cooldownSeconds: 120
    steps:
      - type: PICKUP_ITEM
        zone: power_depot
        item: REDSTONE_TORCH_ON
        amount: 1
        itemName: "&eعدّة الكهربائي"
        title: "استلم العدّة من المستودع"
      - type: CLEAR_SPOTS
        pool: street_lamps
        amount: 8
        title: "صلّح ٨ أعمدة إنارة"
      - type: DELIVER_ITEM
        zone: power_depot
        amount: 1
        title: "سلّم العدّة في المستودع"

# ============================================================
#  التدريب الميداني - المهندس سالم: السلامة أولاً
# ============================================================
training:
  trainer: power_chief
  intro: "&7تم تعيينك. &eالمهندس سالم &7يتفقّد الأعمدة في الشوارع — روح دوّر عليه."
  lessons:
    - trigger: DUTY_START
      hint: "روح لمستودع الكهرباء واكتب /duty"
      text:
        - "وقف قبل لا تروح. أنا سالم، رئيس الفنيين."
        - "في شغلنا السلامة قبل السرعة، وقبل الراتب، وقبل كل شي."
        - "أول قاعدة: ما فيه فني يشتغل بدون تسجيل دوام. لو صار شي، لازم نعرف مين بالشارع."
        - "سجّل في المستودع وارجع لي."
    - trigger: CONTRACT_START
      hint: "افتح /jobs واختر مهمة"
      text:
        - "القاعدة الثانية، واحفظها زين:"
        - "إحنا نصلّح — ما نكسر ولا نفكّ ولا نغيّر أي شي في المدينة."
        - "العمود مو ملكك، هو ملك البلدية. تصلّحه وتمشي."
        - "أي فني يخرّب عمود، يطلع من الجهاز في نفس اليوم. مفهوم؟"
        - "الحين اختار مهمة."
    - trigger: SPOT_CLEARED
      hint: "اقترب من العمود المعطّل واضغط يمين"
      text:
        - "العمود المعطّل تعرفه من بعيد: دخان خفيف وشرر يطلع منه."
        - "اقترب منه واضغط يمين — لا تتسرع ولا تشتغل من مسافة."
        - "العمود المعطّل مو خطر يا ولدي. المتسرّع هو الخطر."
    - trigger: CONTRACT_DONE
      hint: "كمّل المهمة وسلّم العدّة"
      text:
        - "زين. صار عندك عمود شغّال."
        - "لو مهمتك فيها عدّة، العدّة من المستودع وترجع للمستودع."
        - "ما نخلي عدّة بالشارع ولا نودّيها البيت. هذي عهدة مسجّلة باسمك."
    - trigger: TALK
      text:
        - "خلاص. صرت فني معتمد عندنا."
        - "الأعمدة تتعطّل كل يوم — كهرباء المدينة قديمة وهذا شغلنا."
        - "اللي تصلّحه يخلص، واللي ما أحد صلّحه يظل مطفي والشارع يظل مظلم."
        - "الناس تمشي بالليل يا ولدي. خلّ هالشي ببالك."
