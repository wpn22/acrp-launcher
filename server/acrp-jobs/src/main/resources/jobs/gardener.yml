# ============================================================
#  البستاني - يسقي حدائق المدينة بنفس مضخة عامل النظافة
#
#  المطلوب قبل التشغيل:
#    منطقة:      garden_depot   (مقر الدوام)
#    نقاط زرع:   /jobsadmin spot new park_plants PLANT
#    (اختياري)   /jobsadmin spot new garden_dirt DIRT   لممرات الحديقة
# ============================================================
id: gardener
name: "&2البستاني"
icon: SAPLING
description:
  - "&7اسقِ زرع المدينة الذابل ونظّف ممرات الحدائق."
  - "&7هادئة ومريحة - وأجرها ثابت."
  - "&fمضخة الماء &7تجيك تلقائياً أول ما تبدأ الدوام."
whitelist: false
dutyZones:
  - garden_depot
tool: PUMP

payroll:
  intervalMinutes: 30
  requiresDuty: true
  taxPercent: 10

grades:
  - level: 1
    name: "مساعد بستاني"
    salary: 110
    xpRequired: 0
    payMultiplier: 1.0
  - level: 2
    name: "بستاني"
    salary: 180
    xpRequired: 300
    payMultiplier: 1.15
  - level: 3
    name: "بستاني أول"
    salary: 260
    xpRequired: 1000
    payMultiplier: 1.3
  - level: 4
    name: "مهندس تنسيق حدائق"
    salary: 350
    xpRequired: 2600
    payMultiplier: 1.45

contracts:
  - id: watering_round
    name: "&fجولة السقي"
    icon: BUCKET
    description:
      - "&7اسقِ &f١٠ &7نباتات ذابلة في حدائق المدينة."
      - "&7وجّه المضخة على النبتة واضغط يمين."
      - "&7الوقت المتوقع: &f~3 دقائق"
    basePay: 260
    randomBonus: 80
    xpReward: 24
    cooldownSeconds: 30
    steps:
      - type: CLEAR_SPOTS
        pool: park_plants
        amount: 10
        title: "اسقِ ١٠ نباتات"

  - id: park_upkeep
    name: "&fصيانة الحديقة"
    icon: SHEARS
    description:
      - "&7اسقِ &f١٥ &7نبتة وارجع للمشتل للتقرير."
      - "&7الوقت المتوقع: &f~5 دقائق"
    basePay: 420
    randomBonus: 120
    xpReward: 45
    cooldownSeconds: 90
    steps:
      - type: CLEAR_SPOTS
        pool: park_plants
        amount: 15
        title: "اسقِ ١٥ نبتة"
      - type: GOTO_ZONE
        zone: garden_depot
        radius: 8
        title: "ارجع للمشتل"
      - type: CONFIRM
        radius: 8
        title: "سلّم تقرير الجولة بـ /jobs confirm"

# ============================================================
#  التدريب الميداني - أم نورة تشرح السقي
# ============================================================
training:
  trainer: gardener_lead
  intro: "&7تم تعيينك. &2أم نورة &7مسؤولة الحدائق تلف على الزرع — روح دوّر عليها."
  lessons:
    - trigger: DUTY_START
      hint: "روح للمشتل واكتب /duty"
      text:
        - "أهلاً فيك. أنا أم نورة، مسؤولة حدائق المدينة."
        - "قبل ما تلمس أي نبتة، سجّل دوامك في المشتل."
        - "الزرع أمانة، وما نسلّم الأمانة لأحد غير مسجّل."
    - trigger: CONTRACT_START
      hint: "افتح /jobs واختر جولة سقي"
      text:
        - "المضخة اللي معك نفس مضخة النظافة — نفس الأداة، شغل مختلف."
        - "قاعدتنا هنا: نسقي بس. ما نقطع، ما نقلع، ما نغيّر شي في الحديقة."
        - "لو شفت نبتة ميتة، بلّغني أنا. لا تشيلها بنفسك."
        - "الحين اختار جولة سقي من قائمة المهام."
    - trigger: SPOT_CLEARED
      hint: "وجّه المضخة على النبتة الذابلة واضغط يمين"
      text:
        - "النبتة اللي تحتاجك تعرفها من شكلها — ورقها ذابل ويتساقط منه غبار."
        - "وجّه المضخة عليها واضغط يمين، وخلك ثابت لين يخلص الرش."
        - "لا تستعجل ولا تمشي وأنت ترش، بيتوقف الرش وتبدأ من جديد."
    - trigger: CONTRACT_DONE
      hint: "كمّل الجولة"
      text:
        - "أحسنت. النبتة صارت مرتوية."
        - "بس انتبه: النبتة المرتوية ما تحتاج ماء ثاني."
        - "ماء زايد يقتل الزرع مثل ما يقتله العطش تماماً."
        - "اسقِ اللي ذابل بس، وكمّل جولتك."
    - trigger: TALK
      text:
        - "خلصت التدريب. صرت من ناس الحديقة."
        - "الزرع اللي تسقيه اليوم يعطش مرة ثانية بعد فترة — هذي طبيعة الشغل."
        - "واللي ما أحد سقاه يظل ذابل لين يجيه أحد. فلا تترك حديقة وراك."
        - "الله يوفقك."
