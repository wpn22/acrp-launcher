# ============================================================
#  عامل النظافة - وظيفة البداية
#  يجمع أكياس الزبالة من الشوارع وينظّف البقع بمضخة الماء.
#
#  المطلوب قبل التشغيل:
#    منطقة:        cleaner_depot   (مقر الدوام)  و  city_dump  (المكب)
#    نقاط زبالة:   /jobsadmin spot new city_trash TRASH
#    نقاط وساخة:   /jobsadmin spot new city_dirt DIRT
# ============================================================
id: cleaner
name: "&aعامل النظافة"
icon: PAPER
description:
  - "&7نظّف شوارع المدينة: اجمع الزبالة واغسل البقع."
  - "&7ما تحتاج خبرة - أنسب وظيفة للاعب الجديد."
  - "&fمضخة الماء &7تجيك تلقائياً أول ما تبدأ الدوام."
whitelist: false
dutyZones:
  - cleaner_depot
# أداة الوظيفة - تُعطى عند بدء الدوام وتُسحب عند إنهائه
tool: PUMP

payroll:
  intervalMinutes: 30
  requiresDuty: true
  taxPercent: 10

grades:
  - level: 1
    name: "عامل تحت التجربة"
    salary: 100
    xpRequired: 0
    payMultiplier: 1.0
  - level: 2
    name: "عامل نظافة"
    salary: 165
    xpRequired: 250
    payMultiplier: 1.15
  - level: 3
    name: "عامل أول"
    salary: 240
    xpRequired: 900
    payMultiplier: 1.3
  - level: 4
    name: "مشرف نظافة"
    salary: 330
    xpRequired: 2400
    payMultiplier: 1.45

contracts:
  # جولة جمع الزبالة: اجمع من الشوارع ثم فرّغ في المكب
  - id: trash_round
    name: "&fجولة جمع الزبالة"
    icon: PAPER
    description:
      - "&7اجمع &f٨ &7أكياس زبالة من الشوارع."
      - "&7بعدها فرّغها في المكب."
      - "&7الوقت المتوقع: &f~3 دقائق"
    basePay: 240
    randomBonus: 80
    xpReward: 22
    cooldownSeconds: 30
    steps:
      - type: CLEAR_SPOTS
        pool: city_trash
        amount: 8
        title: "اجمع ٨ أكياس زبالة من الشوارع"
      - type: GOTO_ZONE
        zone: city_dump
        radius: 8
        title: "فرّغ الأكياس في المكب"
      - type: WAIT_TIMER
        seconds: 8
        title: "جاري التفريغ..."

  # جولة تنظيف البقع بالمضخة
  - id: wash_round
    name: "&fغسيل الشوارع"
    icon: BUCKET
    description:
      - "&7نظّف &f٦ &7بقع بمضخة الماء."
      - "&7وجّه المضخة على البقعة واضغط يمين."
      - "&7الوقت المتوقع: &f~3 دقائق"
    basePay: 220
    randomBonus: 80
    xpReward: 20
    cooldownSeconds: 30
    steps:
      - type: CLEAR_SPOTS
        pool: city_dirt
        amount: 6
        title: "اغسل ٦ بقع بمضخة الماء"

  # جولة كبيرة - للرتب الأعلى، أجر أفضل ووقت أطول
  - id: deep_clean
    name: "&fحملة نظافة شاملة"
    icon: CAULDRON_ITEM
    description:
      - "&7اجمع &f١٢ &7كيس واغسل &f٨ &7بقع."
      - "&7أطول وأتعب - وأجرها أعلى."
      - "&7الوقت المتوقع: &f~6 دقائق"
    basePay: 520
    randomBonus: 160
    xpReward: 55
    cooldownSeconds: 120
    steps:
      - type: CLEAR_SPOTS
        pool: city_trash
        amount: 12
        title: "اجمع ١٢ كيس زبالة"
      - type: CLEAR_SPOTS
        pool: city_dirt
        amount: 8
        title: "اغسل ٨ بقع"
      - type: GOTO_ZONE
        zone: city_dump
        radius: 8
        title: "ارجع للمكب وفرّغ"
