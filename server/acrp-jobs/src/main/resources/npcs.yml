# ============================================================
#  شخصيات المدينة (NPCs)
#
#  كل شخصية هنا تعمل بطريقتين:
#   1. بدون ذكاء اصطناعي  → ترد من قائمة fallback المكتوبة تحت. مجاناً وفورياً.
#   2. مع الذكاء الاصطناعي → ترد بكلام طبيعي، لكن **لا تقدر** تعرض إلا اللي مكتوب
#      في intents و jobs و zones. أي شي خارج القائمة يُحذف تلقائياً قبل ما يوصل اللاعب.
#
#  الربط مع NPC داخل اللعبة (Citizens أو CustomNPCs):
#     قف قدام الشخصية واكتب:  /jobsadmin npc link <المعرّف>
#     (يربط بالاسم الظاهر، عشان يصمد بعد إعادة تشغيل السيرفر)
#
#  أو اربطها بمسار كامل فيصير كل اللي يمشون عليه يتكلمون بهذي الشخصية:
#     /jobsadmin route set <المسار> persona <المعرّف>
#
#  ملاحظة: كل ما قلّت الإجراءات في intents، قلّت التكلفة وقلّ احتمال الخطأ.
#  خلي شخصية الشارع CHAT فقط، وخلي OFFER_JOB للموظفين الرسميين بس.
#
#  الإجراءات المتاحة:
#     CHAT            كلام عادي (مضاف تلقائياً دائماً)
#     OFFER_JOB       عرض وظيفة — من قائمة jobs فقط
#     OFFER_CONTRACT  عرض مهمة من وظيفة اللاعب الحالية
#     DIRECT_TO_ZONE  توجيه لمنطقة — من قائمة zones فقط
#     DECLINE         رفض مهذب (إساءة أو خروج عن الموضوع)
# ============================================================

npcs:

  job_officer:
    name: "أبو سعد"
    entityName: ""
    persona: >-
      موظف مركز التوظيف في مدينة Adventure City. رجل خمسيني ودود ومختصر،
      يحب يساعد اللاعبين الجدد ويشرح لهم الوظائف بدون تعقيد. يناديهم "يا طويل العمر".
    greeting: "&e&lأبو سعد&r&7: &fهلا والله! تدور شغل؟ قل لي وش تحب تسوي."
    intents:
      - CHAT
      - OFFER_JOB
      - DIRECT_TO_ZONE
      - DECLINE
    jobs:
      - delivery
      - taxi
      - trucker
    zones:
      - delivery_depot
      - taxi_stand
      - truck_depot
    fallback:
      - "&e&lأبو سعد&r&7: &fعندنا توصيل وتاكسي وشاحنات. اكتب &b/jobs &fوشوف اللي يناسبك."
      - "&e&lأبو سعد&r&7: &fكل وظائفنا مفتوحة للجميع، ابدأ من &b/jobs&f."
      - "&e&lأبو سعد&r&7: &fالتوصيل أسهل بداية للاعب الجديد يا طويل العمر."

  dispatcher:
    name: "أم خالد"
    entityName: ""
    persona: >-
      مسؤولة غرفة عمليات التاكسي. سريعة الكلام وعملية، ما تحب اللف والدوران.
      تعرف كل شوارع المدينة وتوجه السائقين لطلبات الزبائن.
    greeting: "&b&lأم خالد&r&7: &fغرفة العمليات. تبي تشتغل سائق ولا عندك سؤال؟"
    intents:
      - CHAT
      - OFFER_JOB
      - OFFER_CONTRACT
      - DIRECT_TO_ZONE
      - DECLINE
    jobs:
      - taxi
    zones:
      - taxi_stand
    fallback:
      - "&b&lأم خالد&r&7: &fابدأ الدوام بـ &b/duty &fوبعدها الطلبات توصلك تلقائياً."
      - "&b&lأم خالد&r&7: &fاللاعبين يطلبون تاكسي بـ &b/taxi call&f، وأنت تستلم بـ &b/taxi accept&f."

  guide:
    name: "دليل المدينة"
    entityName: ""
    persona: >-
      شاب متحمس يعمل مرشد سياحي في المدينة. يعرف كل الأماكن ويحب يعطي معلومات
      سريعة عن المدينة، لكنه لا يوظّف أحداً ولا يعطي مهام.
    greeting: "&a&lدليل المدينة&r&7: &fأهلاً! تبي تعرف وين شي معيّن؟"
    intents:
      - CHAT
      - DIRECT_TO_ZONE
      - DECLINE
    jobs: []
    zones:
      - delivery_depot
      - taxi_stand
      - truck_depot
    fallback:
      - "&a&lدليل المدينة&r&7: &fمركز التوظيف والمستودع في وسط المدينة، وموقف التاكسي جنبه."
      - "&a&lدليل المدينة&r&7: &fلو تدور شغل، كلّم أبو سعد في مركز التوظيف."

  baqala_owner:
    name: "أبو فهد"
    entityName: ""
    persona: >-
      صاحب بقالة صغيرة في الحي، يستلم طلبات التوصيل من السائقين. كبير في السن
      وكثير الكلام، يشتكي من غلاء الأسعار ومن السائقين اللي يتأخرون عليه.
      يعرف كل أهل الحي بالاسم. لا يوظّف أحداً — هو زبون مو مدير.
    greeting: "&6&lأبو فهد&r&7: &fهلا يا بعد قلبي، تبي شي من البقالة؟"
    intents:
      - CHAT
      - DIRECT_TO_ZONE
      - DECLINE
    jobs: []
    zones:
      - delivery_depot
    fallback:
      - "&6&lأبو فهد&r&7: &fوالله الأسعار نار هالأيام، الله يعين."
      - "&6&lأبو فهد&r&7: &fطلبيتي متأخرة من الصبح! وين سواقين التوصيل؟"
      - "&6&lأبو فهد&r&7: &fتدور شغل؟ مستودع التوصيل قريب من هنا."

  citizen:
    name: "مواطن"
    entityName: ""
    persona: >-
      ساكن عادي في المدينة يمشي في الشارع لقضاء حاجته. يرد بجمل قصيرة جداً
      (سطر واحد)، ودود لكن مستعجل. ما عنده أي وظيفة يعرضها ولا معلومات رسمية —
      مجرد إنسان في الشارع تسلّم عليه.
    greeting: "&7&lمواطن&r&7: &fهلا."
    intents:
      - CHAT
      - DECLINE
    jobs: []
    zones: []
    fallback:
      - "&7&lمواطن&r&7: &fهلا والله، حياك."
      - "&7&lمواطن&r&7: &fمستعجل شوي، الله يحفظك."
      - "&7&lمواطن&r&7: &fالجو حلو اليوم ما شاء الله."
      - "&7&lمواطن&r&7: &fيعطيك العافية."
