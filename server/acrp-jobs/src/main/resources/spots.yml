# ============================================================
#  نقاط العمل في المدينة (Work Spots)
#  الزبالة والأوساخ والزرع الذابل وأعمدة الإنارة المعطّلة.
#
#  ما تحتاج تكتب هنا شي — حدّدها داخل اللعبة:
#
#     /jobsadmin spot new city_trash TRASH   ← ياخذك لوضع التحديد ويعطيك العصا
#     نقرة يمين على بلوك                     ← نقطة جديدة
#     نقرة يسار على بلوك                     ← تراجع عن آخر نقطة
#     /jobsadmin spot done                   ← يعرض لك النقاط ويسأل [نعم] / [لا]
#
#  الأنواع:
#     TRASH   كيس زبالة على الأرض   → نقرة يمين عليه لجمعه
#     DIRT    بقعة وساخة            → تُنظّف بمضخة الماء
#     PLANT   زرع ذابل              → يُسقى بنفس المضخة
#     LAMP    عمود إنارة معطّل      → نقرة يمين لإصلاحه
#
#  كيف يشتغل الدوران:
#     تحدد ٢٠ نقطة مثلاً ➜ activeCount: 9 ➜ تسعة منها فيها شغل في نفس الوقت.
#     أول ما ينظّف العامل نقطة، ينقص العدد لـ ٨ **ويظل ٨** لمدة respawnMinutes،
#     وبعدها ترجع نقطة جديدة في **مكان ثاني** فيصير ٩.
#     النقطة اللي ما أحد نظّفها **ما تتحرك أبداً** — تظل مكانها لين ينظفها أحد.
#     يعني الحي المهمَل يتراكم فيه الوسخ فعلاً، والحي النظيف يبان نظيف.
# ============================================================
#
# مثال كامل (احذف علامة # لو تبي تكتبه بيدك):
#
# pools:
#   city_trash:
#     type: TRASH
#     world: world
#     # كم نقطة فيها شغل في نفس الوقت
#     activeCount: 9
#     # بعد كم دقيقة ترجع النقطة اللي تنظّفت (في مكان ثاني)
#     respawnMinutes: 10
#     # ما يظهر شي إلا إذا فيه لاعب داخل هذي المسافة (بلوك)
#     activationRange: 48
#     # النقاط بصيغة x,y,z — تُكتب تلقائياً من نقراتك داخل اللعبة
#     points:
#       - "120.5,64.0,-88.5"
#       - "134.5,64.0,-92.5"
#       - "141.5,65.0,-70.5"
#
#   downtown_dirt:
#     type: DIRT
#     world: world
#     activeCount: 6
#     respawnMinutes: 12
#     points:
#       - "118.5,64.0,-80.5"
#
#   park_plants:
#     type: PLANT
#     world: world
#     activeCount: 10
#     respawnMinutes: 15
#     points:
#       - "90.5,64.0,-40.5"
#
#   street_lamps:
#     type: LAMP
#     world: world
#     activeCount: 5
#     respawnMinutes: 20
#     # اختياري: يبدّل البلوك نفسه بين مضيء ومطفي.
#     # معطّل افتراضياً لأن مصباح الردستون في 1.12.2 ممكن ينطفي مع أي تحديث
#     # بلوك جنبه. الجزيئات (دخان وشرر) تشتغل دائماً بدون هذا الخيار.
#     swapBlock: false
#     points:
#       - "100.5,68.0,-55.5"

pools: {}
