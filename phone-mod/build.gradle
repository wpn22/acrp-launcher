buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 3 is the last line that supports 1.12.2. It requires
        // Gradle 4.10.3 and a Java 8 toolchain — see gradle/wrapper and README.
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply plugin: 'eclipse'

version = project.mod_version
group = 'com.acrp.phone'
archivesBaseName = project.mod_id

sourceCompatibility = 1.8
targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // Simple Voice Chat API — used for phone calls. Compile-only, so the mod
        // still loads (minus calls) on a pack without voice chat installed.
        name = 'maxhenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.mc_version}-${project.forge_version}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    testImplementation 'junit:junit:4.13.2'
}

// The text engine is plain JDK, so its tests run without a Minecraft context.
test {
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

processResources {
    inputs.property 'version', project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.mc_version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : 'Adventure City Roleplay',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Adventure City Roleplay'
        ])
    }
}
