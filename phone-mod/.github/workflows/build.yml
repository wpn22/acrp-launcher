name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Fast lane: the Arabic text engine is plain JDK, so it compiles and tests in
  # seconds without pulling down Forge or decompiling Minecraft. This is the job
  # that should stay green on every commit.
  text-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Fetch JUnit
        run: |
          mkdir -p build/testlibs
          curl -sSfL -o build/testlibs/junit.jar \
            https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfL -o build/testlibs/hamcrest.jar \
            https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      # Only the Minecraft-free sources. PhoneNbt and everything under item/ do
      # import Forge, so they belong to the slow lane below.
      - name: Compile Minecraft-free sources
        run: |
          mkdir -p build/classes build/testclasses
          javac -encoding UTF-8 -d build/classes \
            $(find src/main/java/com/acrp/phone/client/text -name '*.java') \
            src/main/java/com/acrp/phone/client/font/AtlasPacker.java \
            src/main/java/com/acrp/phone/core/PhoneNumber.java
          javac -encoding UTF-8 \
            -cp "build/classes:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            -d build/testclasses \
            $(find src/test/java -name '*.java')

      - name: Run tests
        run: |
          java -Dfile.encoding=UTF-8 \
            -cp "build/classes:build/testclasses:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            org.junit.runner.JUnitCore \
            com.acrp.phone.client.text.TextShaperTest \
            com.acrp.phone.client.text.TextLayoutTest \
            com.acrp.phone.client.font.AtlasPackerTest \
            com.acrp.phone.core.PhoneNumberTest

      - name: Render visual proof
        run: |
          java -Dfile.encoding=UTF-8 -Djava.awt.headless=true \
            -cp "build/classes:build/testclasses:build/testlibs/junit.jar:build/testlibs/hamcrest.jar" \
            com.acrp.phone.client.text.TextRenderProof build/text-proof.png

      - uses: actions/upload-artifact@v4
        with:
          name: text-proof
          path: build/text-proof.png

  # Slow lane: the real Forge build. Decompiling 1.12.2 takes a while, so this
  # runs alongside rather than gating the fast lane.
  forge-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forge-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-forge-

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: acrpphone-jar
          path: build/libs/*.jar
